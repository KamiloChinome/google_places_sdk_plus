name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing)'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Tag for GitHub Release (empty = skip release step). Example: google_places_sdk_plus_web-v1.1.1'
        required: false
        type: string
        default: ''

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  validate:
    name: Validate all packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup local dependency overrides
        run: |
          PACKAGES=(
            google_places_sdk_plus
            google_places_sdk_plus_platform_interface
            google_places_sdk_plus_android
            google_places_sdk_plus_ios
            google_places_sdk_plus_web
            google_places_sdk_plus_http
            google_places_sdk_plus_linux
            google_places_sdk_plus_macos
            google_places_sdk_plus_windows
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "dependency_overrides:" > "$pkg/pubspec_overrides.yaml"
            for dep in "${PACKAGES[@]}"; do
              if [ "$dep" != "$pkg" ]; then
                echo "  $dep:" >> "$pkg/pubspec_overrides.yaml"
                echo "    path: ../$dep" >> "$pkg/pubspec_overrides.yaml"
              fi
            done
          done
          echo "dependency_overrides:" > "google_places_sdk_plus/example/pubspec_overrides.yaml"
          for dep in "${PACKAGES[@]}"; do
            echo "  $dep:" >> "google_places_sdk_plus/example/pubspec_overrides.yaml"
            echo "    path: ../../$dep" >> "google_places_sdk_plus/example/pubspec_overrides.yaml"
          done

      - name: Generate code (platform_interface)
        run: |
          cd google_places_sdk_plus_platform_interface
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate code (http)
        run: |
          cd google_places_sdk_plus_http
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test all packages
        run: |
          PACKAGES=(
            google_places_sdk_plus_platform_interface
            google_places_sdk_plus_http
            google_places_sdk_plus_linux
            google_places_sdk_plus_macos
            google_places_sdk_plus_windows
            google_places_sdk_plus_android
            google_places_sdk_plus_ios
            google_places_sdk_plus_web
            google_places_sdk_plus
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "=== $pkg ==="
            cd "$pkg"
            flutter pub get
            flutter analyze
            if [ "$pkg" = "google_places_sdk_plus_web" ]; then
              flutter test --platform chrome || true
            else
              flutter test
            fi
            cd ..
          done

  publish:
    name: Publish to pub.dev
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate code (platform_interface)
        run: |
          cd google_places_sdk_plus_platform_interface
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate code (http)
        run: |
          cd google_places_sdk_plus_http
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Publish each package in dependency order. The helper skips packages whose
      # pubspec.yaml version is already published on pub.dev, so the workflow is
      # idempotent and can be re-run safely for partial (single-package) releases.
      - name: Publish packages (idempotent)
        run: |
          set -e
          publish_pkg() {
            local pkg="$1"
            echo "::group::$pkg"
            pushd "$pkg" > /dev/null
            local LOCAL
            LOCAL=$(grep "^version:" pubspec.yaml | awk '{print $2}' | tr -d '"')
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run: $pkg @ $LOCAL"
              dart pub publish --dry-run
            else
              local REMOTE
              REMOTE=$(curl -sf "https://pub.dev/api/packages/$pkg" \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['latest']['version'])" 2>/dev/null \
                || echo "none")
              if [ "$LOCAL" = "$REMOTE" ]; then
                echo "::notice::$pkg — already at $LOCAL on pub.dev, skipping"
              else
                echo "::notice::$pkg — publishing $LOCAL (pub.dev has $REMOTE)"
                dart pub publish --force
              fi
            fi
            popd > /dev/null
            echo "::endgroup::"
          }
          wait_for_indexing() {
            if [ "$DRY_RUN" != "true" ]; then sleep 30; fi
          }

          # Layer 1: platform_interface (no internal deps)
          publish_pkg google_places_sdk_plus_platform_interface
          wait_for_indexing

          # Layer 2: http (depends on platform_interface)
          publish_pkg google_places_sdk_plus_http
          wait_for_indexing

          # Layer 3: platform implementations
          publish_pkg google_places_sdk_plus_android
          publish_pkg google_places_sdk_plus_ios
          publish_pkg google_places_sdk_plus_web
          publish_pkg google_places_sdk_plus_linux
          publish_pkg google_places_sdk_plus_macos
          publish_pkg google_places_sdk_plus_windows
          wait_for_indexing

          # Layer 4: main package (depends on all platform packages)
          publish_pkg google_places_sdk_plus

  release:
    name: Create GitHub Release
    needs: publish
    if: ${{ !inputs.dry_run && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          generate_release_notes: true
