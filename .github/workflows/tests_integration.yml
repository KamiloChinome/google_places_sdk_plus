name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      run_real_api:
        description: 'Run real API tests (requires PLACES_API_KEY secret)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'google_places_sdk_plus/**'
      - 'google_places_sdk_plus_platform_interface/**'
      - 'google_places_sdk_plus_android/**'
      - 'google_places_sdk_plus_ios/**'
  pull_request:
    branches: [main]
    paths:
      - 'google_places_sdk_plus/**'
      - 'google_places_sdk_plus_platform_interface/**'
      - 'google_places_sdk_plus_android/**'
      - 'google_places_sdk_plus_ios/**'

env:
  FLUTTER_VERSION: '3.41.7'
  JAVA_VERSION: '17'

jobs:
  mocked-integration:
    name: Mocked integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Monorepo: override deps to use local packages
      - name: Setup local dependency overrides
        run: |
          PACKAGES=(
            google_places_sdk_plus
            google_places_sdk_plus_platform_interface
            google_places_sdk_plus_android
            google_places_sdk_plus_ios
            google_places_sdk_plus_web
            google_places_sdk_plus_http
            google_places_sdk_plus_linux
            google_places_sdk_plus_macos
            google_places_sdk_plus_windows
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "dependency_overrides:" > "$pkg/pubspec_overrides.yaml"
            for dep in "${PACKAGES[@]}"; do
              if [ "$dep" != "$pkg" ]; then
                echo "  $dep:" >> "$pkg/pubspec_overrides.yaml"
                echo "    path: ../$dep" >> "$pkg/pubspec_overrides.yaml"
              fi
            done
          done
          echo "dependency_overrides:" > "google_places_sdk_plus/example/pubspec_overrides.yaml"
          for dep in "${PACKAGES[@]}"; do
            echo "  $dep:" >> "google_places_sdk_plus/example/pubspec_overrides.yaml"
            echo "    path: ../../$dep" >> "google_places_sdk_plus/example/pubspec_overrides.yaml"
          done

      # Monorepo: generate freezed/json_serializable code
      - name: Generate code (platform_interface)
        run: |
          cd google_places_sdk_plus_platform_interface
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate code (http)
        run: |
          cd google_places_sdk_plus_http
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install dependencies
        run: flutter pub get
        working-directory: google_places_sdk_plus/example

      - name: Run mocked integration tests
        run: xvfb-run flutter test integration_test/mocked_places_test.dart -d linux
        working-directory: google_places_sdk_plus/example

  real-api-android:
    name: Real API tests (Android)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_real_api == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Monorepo: override deps to use local packages
      - name: Setup local dependency overrides
        run: |
          PACKAGES=(
            google_places_sdk_plus
            google_places_sdk_plus_platform_interface
            google_places_sdk_plus_android
            google_places_sdk_plus_ios
            google_places_sdk_plus_web
            google_places_sdk_plus_http
            google_places_sdk_plus_linux
            google_places_sdk_plus_macos
            google_places_sdk_plus_windows
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "dependency_overrides:" > "$pkg/pubspec_overrides.yaml"
            for dep in "${PACKAGES[@]}"; do
              if [ "$dep" != "$pkg" ]; then
                echo "  $dep:" >> "$pkg/pubspec_overrides.yaml"
                echo "    path: ../$dep" >> "$pkg/pubspec_overrides.yaml"
              fi
            done
          done
          echo "dependency_overrides:" > "google_places_sdk_plus/example/pubspec_overrides.yaml"
          for dep in "${PACKAGES[@]}"; do
            echo "  $dep:" >> "google_places_sdk_plus/example/pubspec_overrides.yaml"
            echo "    path: ../../$dep" >> "google_places_sdk_plus/example/pubspec_overrides.yaml"
          done

      # Monorepo: generate freezed/json_serializable code
      - name: Generate code (platform_interface)
        run: |
          cd google_places_sdk_plus_platform_interface
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate code (http)
        run: |
          cd google_places_sdk_plus_http
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install dependencies
        run: flutter pub get
        working-directory: google_places_sdk_plus/example

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real API integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: >
            flutter test
            integration_test/real_api_test.dart
            --dart-define=API_KEY=${{ secrets.PLACES_API_KEY }}
          working-directory: google_places_sdk_plus/example
